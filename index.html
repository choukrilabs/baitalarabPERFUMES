<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>عطور بيت العرب - عطور شرقية وعود أصلي الدار البيضاء</title>
    <meta name="description" content="تأسس بيت العرب عام 1984 في حي الحبوس بالدار البيضاء. نقدم عطور شرقية، عود، وبخور أصلية 100%. اكتشف دفء الأصالة المغربية للبيع بالتجزئة والجملة." />
    <link rel="icon" type="image/webp" href="/logo_small.webp" />
    <link rel="apple-touch-icon" href="/logo_small.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400..700&family=Tajawal:wght@300;400;500;700;800;900&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400..700&family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400..700&family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    </noscript>
  </head>
  <body class="bg-[#FAF9F6] text-[#1A1A1A] antialiased selection:bg-[#8C7342] selection:text-white font-['Tajawal',sans-serif]">
    <script>
      // Suppress expected Vite websocket connection errors in AI Studio
      const originalConsoleError = console.error;
      console.error = function(...args) {
        if (args[0] && typeof args[0] === 'string' && args[0].includes('failed to connect to websocket')) return;
        if (args[0] && typeof args[0] === 'string' && args[0].includes('WebSocket closed without opened')) return;
        if (args[0] instanceof Error && args[0].message.includes('WebSocket closed without opened')) return;
        originalConsoleError.apply(console, args);
      };
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && event.reason.message && event.reason.message.includes('WebSocket')) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        if (event.message && event.message.includes('WebSocket')) {
          event.preventDefault();
        }
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
